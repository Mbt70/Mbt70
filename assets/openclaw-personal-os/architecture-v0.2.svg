<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw and AgentBox architecture</title>
  <desc id="desc">A diagram showing OpenClaw as the AI agent layer, AgentBox as the visible workspace, and GitHub, LinkedIn, and case studies as public outputs.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:white;stroke:#cbd5e1;stroke-width:2}.agent{fill:#eef2ff;stroke:#6366f1}.box{fill:#f0fdf4;stroke:#22c55e}.out{fill:#fff7ed;stroke:#f97316}.guard{fill:#111827}.text{font-family:Inter,Arial,sans-serif;fill:#111827}.muted{fill:#475569}.small{font-size:24px}.xs{font-size:20px}.h1{font-size:40px;font-weight:700}.h2{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 8}.white{fill:white}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760" rx="0"/>
  <text x="64" y="72" class="text h1">OpenClaw Personal OS / AgentBox</text>
  <text x="64" y="112" class="muted small">How a private AI assistant workflow becomes reviewable project records</text>

  <rect x="64" y="170" width="320" height="220" rx="22" class="card agent"/>
  <text x="96" y="220" class="text h2">OpenClaw</text>
  <text x="96" y="260" class="muted small">AI agent layer</text>
  <text x="96" y="310" class="text xs">• reads and drafts local files</text>
  <text x="96" y="344" class="text xs">• helps classify captures</text>
  <text x="96" y="378" class="text xs">• supports reminders and reviews</text>

  <rect x="480" y="170" width="320" height="220" rx="22" class="card box"/>
  <text x="512" y="220" class="text h2">AgentBox</text>
  <text x="512" y="260" class="muted small">Visible workspace</text>
  <text x="512" y="310" class="text xs">• Inbox: raw captures</text>
  <text x="512" y="344" class="text xs">• Tasks: next actions</text>
  <text x="512" y="378" class="text xs">• Projects: logs and briefs</text>

  <rect x="896" y="170" width="320" height="220" rx="22" class="card out"/>
  <text x="928" y="220" class="text h2">Public outputs</text>
  <text x="928" y="260" class="muted small">Only after review</text>
  <text x="928" y="310" class="text xs">• GitHub README / repo notes</text>
  <text x="928" y="344" class="text xs">• case studies</text>
  <text x="928" y="378" class="text xs">• LinkedIn summaries</text>

  <path d="M388 280 H468" class="arrow"/>
  <path d="M804 280 H884" class="arrow"/>

  <rect x="144" y="470" width="990" height="142" rx="22" class="card"/>
  <text x="184" y="520" class="text h2">Operating principle</text>
  <text x="184" y="558" class="text small">OpenClaw helps process work. AgentBox keeps the state visible.</text>
  <text x="184" y="592" class="text small">Public outputs are created only from reviewed, sanitized records.</text>

  <rect x="330" y="650" width="620" height="58" rx="20" class="guard"/>
  <text x="365" y="687" class="white small">Guardrails: human approval · privacy filtering · verification before claims</text>
</svg>
